services:
  folio:
    build: .
    init: true
    restart: unless-stopped
    environment:
      FOLIO_USERNAME: ${FOLIO_USERNAME:-folio}
      FOLIO_PASSWORD: ${FOLIO_PASSWORD:?Set FOLIO_PASSWORD in .env or your shell}
      FOLIO_ORIGIN: ${FOLIO_ORIGIN:-http://localhost:${FOLIO_HOST_PORT:-8080}}
    ports:
      - "127.0.0.1:${FOLIO_HOST_PORT:-8080}:8080"
    volumes:
      - folio-data:/data
volumes:
  folio-data:
