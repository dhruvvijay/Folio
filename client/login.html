<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f7f7f2">
  <title>Sign in to Folio</title>
  <link rel="icon" type="image/svg+xml" href="/folio.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/account.css">
  <script defer src="/account.js"></script>
</head>
<body class="account-page">
  <main class="account-layout">
    <aside class="account-intro" aria-label="About Folio">
      <div class="account-brand">
        <img src="/folio.svg" width="39" height="39" alt="">
        <span>folio<i>.</i></span>
      </div>
      <div class="account-intro-copy">
        <h2>Make sense of<br>your money.</h2>
        <p>Track spending, plan your bills, and see how your savings goals are coming along.</p>
      </div>
    </aside>
    <section class="account-entry" aria-label="Your Folio account">
      <div id="folio-login" class="account-entry-card" aria-busy="true">
        <h1 class="account-heading">Welcome to Folio</h1>
        <p class="account-intro-text" role="status">Checking your session…</p>
      </div>
      <noscript><p>Enable JavaScript to sign in to Folio.</p></noscript>
    </section>
  </main>
</body>
</html>
